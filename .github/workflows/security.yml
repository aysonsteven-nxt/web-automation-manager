name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: cp automations.ci.json automations.json && python -m pytest -q

  static-and-secret-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static analyzer
        run: python -m pip install --upgrade pip bandit

      - name: Run Bandit
        run: python -m bandit -r . -ll -x ./.venv,./ms-playwright,./tests

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-smoke-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q api.py automation run_automation.py session_check.py session_manager.py watch_votes.py

      - name: Prepare CI configuration
        run: cp automations.ci.json automations.json

      - name: Import application
        env:
          AUTOMATION_API_TOKEN: ci-test-token
        run: python -c "import api; assert api.app.title == 'Automation Manager API'"
