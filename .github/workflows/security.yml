name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest pytest-cov pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: cp automations.ci.json automations.json && python -m pytest --cov=api --cov=automation --cov-report=term-missing --cov-report=xml --cov-fail-under=90 -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  static-and-secret-analysis:
    name: Static and secret analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static analyzer
        run: python -m pip install --upgrade pip bandit

      - name: Run Bandit
        run: python -m bandit -r . -ll -x ./.venv,./ms-playwright,./tests

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff
        run: ruff check --select E,F,I api.py automation run_automation.py

  build-and-smoke-check:
    name: Build and application smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q api.py automation run_automation.py session_check.py session_manager.py watch_votes.py

      - name: Prepare CI configuration
        run: cp automations.ci.json automations.json

      - name: Import application
        env:
          AUTOMATION_API_TOKEN: ci-test-token
        run: python -c "import api; assert api.app.title == 'Automation Manager API'"
